name: breezze
description: Free, listener-first music streaming with discovery, playlists and offline listening.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.6.0
  file_selector: ^1.0.3
  flutter_svg: ^2.0.10

  breezze_design_system:
    path: ../../packages/design_system
  breezze_audio_contracts:
    path: ../../packages/audio_contracts
  breezze_api_client:
    path: ../../packages/api_client

  # State management (spec §25: Riverpod, ADR-001)
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Audio engine (native ExoPlayer / AVFoundation wrappers)
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  # Native desktop implementations for the shared just_audio engine.
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9

  # Background audio: lock-screen controls, notification, audio focus
  audio_service: ^0.18.15
  # Platform adapters for the same audio_service media-session bridge.
  audio_service_mpris: ^0.2.1
  audio_service_win: ^0.0.3

  # HTTP for backend connections
  http: ^1.2.1
  url_launcher: ^6.3.2
  # Official YouTube IFrame player for supported embedded platforms.
  video_player: ^2.9.2
  youtube_player_iframe: 5.2.2
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.4
  # One auth authority on every platform; Google/Apple use native sheets.
  supabase_flutter: 2.18.3
  google_sign_in: 7.2.0
  sign_in_with_apple: 8.1.0
  crypto: ^3.0.6

  # App-private storage locations
  path_provider: ^2.1.3

  # Local database (Drift / SQLite) — favorites, recent, sync outbox
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
